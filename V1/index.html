<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../V1/style.css">
    <title>Cadastro</title>
</head>
<body>
    <header>
        <h1>...</h1>
    </header>
    <main>
        <div class="cartao">
            <form action="">
                <div class="parte-esquerda">
                    <div class="parte-esquerda-organizar">
                        <div class="cartao-conteudo">
                            <label class="label" for="">Nome Completo:</label>
                            <input class="input" id="nomec" type="text" placeholder="Nome...">
                        </div>
                        <div class="cartao-conteudo">
                            <label class="label" for="">CPF:</label>
                            <input class="input" id="cpf" type="number" placeholder="CPF...">
                        </div>
                        <div class="cartao-conteudo">
                            <label class="label" for="">RG:</label>
                            <input class="input" id="rg" type="number" placeholder="RG...">
                        </div>
                        <div class="cartao-conteudo">
                            <label class="label" for="">Data de Nascimento:</label>
                            <input class="input" id="data" type="date">
                        </div>
                        <div class="cartao-conteudo">
                            <label class="label" for="">Gênero:</label>
                            <select class="input" id="genero" name="" id="">
                                <option value="selecionado" selected>Selecione...</option>
                                <option value="masculino">Masculino</option>
                                <option value="feminino">Feminino</option>
                                <option value="?">Prefiro não dizer...</option>
                            </select>
                        </div>
                        <div class="cartao-conteudo">
                            <label class="label" for="">Estado Civíl: </label>
                            <select class="input" id="ec" name="" id="">
                                <option value="selecionado" selected>Selecione...</option>
                                <option value="solteiro">Solteiro</option>
                                <option value="casado">Casado</option>
                                <option value="ceparado">Separado</option>
                                <option value="divorciado">Divorciado</option>
                                <option value="viuvo(a)">Viúvo(a)</option>
                            </select>
                        </div>
                        <div class="cartao-conteudo">
                            <label class="label" for="">Contato:</label>
                            <input class="input" id="contato" type="number" placeholder="Contato...">
                        </div>
                    </div>
                </div>
                <div class="parte-direita">
                    <div class="parte-direita-organizar">
                        <div class="cartao-conteudo">
                            <label class="label" for="cep">CEP: </label>
                            <input class="input" id="cep" type="number" placeholder="CEP...">
                        </div>
                        <div class="cartao-conteudo">
                            <label class="label" for="endereco">Endereço: </label>
                            <input class="input" id="endereco" type="text" placeholder="Endereço...">
                        </div>
                        <div class="cartao-conteudo" id="ncartao">
                            <label class="label" for="n">N&#xB0;: </label>
                            <input class="input" id="n" type="number" placeholder="N...">
                        </div>
                        <div class="cartao-conteudo">
                            <label class="label" for="cidade">Cidade: </label>
                            <select class="input" id="cidade" name="cidade" id="">
                                <option value="selecionado" selected>Selecione...</option>
                                <option value="Curitiba">Curitiba</option>
                                <option value="Pinhais">Pinhais</option>
                                <option value="Piraquara">Piraquara</option>
                            </select>
                        </div>
                        <div class="cartao-conteudo">
                            <label class="label" for="estado">Estado: </label>
                            <select class="input" id="estado" name="estado">
                                <option value="selecionado" selected>Selecione...</option>
                                <option value="pr">PR</option>
                                <option value="sc">SC</option>
                                <option value="rs">RS</option>
                            </select>
                        </div>
                        <div class="cartao-conteudo" id="paiscartao">
                            <label class="label" for="pais">País: </label>
                            <select class="input" id="pais" name="pais">
                                <option value="selecionado" selected>Selecione...</option>
                                <option value="BR">Brasil</option>
                                <option value="AR">Argentina</option>
                                <option value="PY">Paraguai</option>
                            </select>
                        </div>
                        <div class="cartao-conteudo">
                            <label class="label" for="">Email:</label>
                            <input class="input" id="email" type="email" placeholder="Email...">
                        </div>
                    </div>
                </div>
            </form>
            <div class="organizar-botoes">
                <div class="botoes">
                    <input type="submit" value="CADASTRAR-SE">
                    <input type="reset" value="LIMPAR">
                </div>
            </div>
        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
